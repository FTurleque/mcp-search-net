name: Scheduled dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: scheduled-dependency-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency vulnerability audit (${{ matrix.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ref:
          - master
          - develop
    steps:
      - name: Check out ${{ matrix.ref }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit complete dependency tree
        run: npm audit --audit-level=moderate

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=moderate
