name: One-shot Node Audit Fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/audit-remediation-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact remediation head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact validated Node fixes
        shell: python
        run: |
          from pathlib import Path

          gateway = Path('src/infrastructure/fetch/secure-http-gateway.ts')
          source = gateway.read_text()
          old = """      let settled = false;
                let absoluteTimer: NodeJS.Timeout | undefined;

                const settleResolve = (response: PinnedResponse): void => {
                  if (settled) return;
                  settled = true;
                  if (absoluteTimer !== undefined) clearTimeout(absoluteTimer);
                  resolve(response);
                };
                const settleReject = (error: unknown): void => {
                  if (settled) return;
                  settled = true;
                  if (absoluteTimer !== undefined) clearTimeout(absoluteTimer);
                  reject(toPinnedRequestError(error));
                };"""
          new = """      let settled = false;

                const settleResolve = (response: PinnedResponse): void => {
                  if (settled) return;
                  settled = true;
                  clearTimeout(absoluteTimer);
                  resolve(response);
                };
                const settleReject = (error: unknown): void => {
                  if (settled) return;
                  settled = true;
                  clearTimeout(absoluteTimer);
                  reject(toPinnedRequestError(error));
                };"""
          if old not in source:
              raise SystemExit('GATEWAY_EXPECTED_BLOCK_NOT_FOUND')
          source = source.replace(old, new, 1)
          old_timer = "      absoluteTimer = setTimeout(() => {"
          if old_timer not in source:
              raise SystemExit('GATEWAY_TIMER_ASSIGNMENT_NOT_FOUND')
          source = source.replace(old_timer, "      const absoluteTimer = setTimeout(() => {", 1)
          gateway.write_text(source)

          http_utils = Path('src/infrastructure/http/http-utils.ts')
          source = http_utils.read_text()
          old = """  const reader = response.body?.getReader();
            if (reader === undefined) {
              try {
                return JSON.parse('');
              } catch (error) {
                throw providerUnavailable(service, `${service} returned invalid JSON`, error);
              }
            }

            const chunks: Uint8Array[] = [];"""
          new = """  if (response.body === null) {
              throw providerUnavailable(service, `${service} returned an empty response body`, undefined);
            }
            const reader = response.body.getReader();

            const chunks: Uint8Array[] = [];"""
          if old not in source:
              raise SystemExit('HTTP_UTILS_READER_BLOCK_NOT_FOUND')
          source = source.replace(old, new, 1)
          old_value = """    if (done) break;
                if (value === undefined) continue;
                total += value.byteLength;"""
          new_value = """    if (done) break;
                total += value.byteLength;"""
          if old_value not in source:
              raise SystemExit('HTTP_UTILS_VALUE_BLOCK_NOT_FOUND')
          source = source.replace(old_value, new_value, 1)
          http_utils.write_text(source)

          value_tests = Path('tests/domain/value-objects.test.ts')
          source = value_tests.read_text()
          needle = "    expect(() => WebUrl.create('file:///etc/passwd')).toThrow(/HTTP and HTTPS/u);\n"
          addition = needle + """    expect(() => WebUrl.createTransport('https://user:secret@example.com/docs')).toThrow(
                /credentials/u,
              );
          """
          if needle not in source:
              raise SystemExit('VALUE_OBJECT_TEST_INSERTION_POINT_NOT_FOUND')
          source = source.replace(needle, addition, 1)
          value_tests.write_text(source)

          http_tests = Path('tests/infrastructure/http-utils.test.ts')
          source = http_tests.read_text()
          marker = '\n});'
          addition = """

            it('rejects an empty provider response body', async () => {
              const fetchMock = vi.fn(async () => new Response(null, { status: 200 }));

              await expect(
                fetchJson('crawl4ai', new URL('https://example.com'), {}, 1_000, fetchMock as typeof fetch),
              ).rejects.toMatchObject({ code: 'CONTENT_PROVIDER_UNAVAILABLE' });
            });
          """
          index = source.rfind(marker)
          if index < 0:
              raise SystemExit('HTTP_UTILS_TEST_INSERTION_POINT_NOT_FOUND')
          source = source[:index] + addition + source[index:]
          http_tests.write_text(source)

      - name: Format affected files
        run: >-
          npx prettier --write
          src/infrastructure/fetch/secure-http-gateway.ts
          src/infrastructure/http/http-utils.ts
          tests/domain/value-objects.test.ts
          tests/infrastructure/http-utils.test.ts

      - name: Validate exact fixes
        run: |
          npm run lint
          npm run typecheck
          npm run test:coverage

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/infrastructure/fetch/secure-http-gateway.ts \
            src/infrastructure/http/http-utils.ts \
            tests/domain/value-objects.test.ts \
            tests/infrastructure/http-utils.test.ts
          git diff --cached --quiet && { echo 'NO_NODE_FIX_CHANGES'; exit 0; }
          git commit -m 'fix: satisfy Node quality and coverage gates'
          git push origin "HEAD:${{ github.head_ref }}"
