name: Format architecture temporary

on:
  push:
    branches:
      - docs/arc42-architecture
    paths:
      - docs/architecture/**
      - .github/workflows/format-architecture-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: docs/arc42-architecture
          fetch-depth: 0
      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format architecture docs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write docs/architecture
          rm .github/workflows/format-architecture-temp.yml
          git diff --check
      - name: Commit formatted documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture .github/workflows/format-architecture-temp.yml
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
            exit 0
          fi
          git commit -m "docs: format architecture documentation"
          git push origin HEAD:docs/arc42-architecture
