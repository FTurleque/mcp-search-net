name: Release PR contract

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: release-pr-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-develop-promotion:
    # Keep this check name stable: existing rulesets may reference it.
    name: Validate develop to master qualification policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      QUALIFIED_SHA: ${{ github.event.pull_request.head.sha }}
      RELEASE_PR_BODY: ${{ github.event.pull_request.body || '' }}
      RELEASE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RELEASE_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      RELEASE_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      RELEASE_PR_VERIFY_TOPOLOGY: '1'
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch current protected branch heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/develop:refs/remotes/origin/develop \
            +refs/heads/master:refs/remotes/origin/master

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0

      - name: Enforce immutable release qualification body and topology
        run: node scripts/check-release-pr-contract.mjs

      - name: Verify exact qualified head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          printf 'RELEASE_PR_CONTRACT_QUALIFIED_SHA=%s\n' "$QUALIFIED_SHA"
