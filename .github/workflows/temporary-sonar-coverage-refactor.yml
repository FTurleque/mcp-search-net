name: Temporary Sonar coverage refactor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refactor-and-test:
    if: github.event.pull_request.number == 102 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refactor zero-coverage CLI logic into tested preflight module
        shell: bash
        run: |
          cat > src/cli/catalog-sync-preflight.ts <<'EOF'
          import type { SyncCatalogResumeCursor } from '../application/use-cases/sync-catalog-documents.js';
          import {
            loadCatalogSourceConfig,
            type CatalogSourceConfig,
          } from './catalog-source-config.js';

          const RESUME_FINGERPRINT_PATTERN = /^[a-fA-F0-9]{64}$/u;

          export async function preloadCatalogSourceConfig(
            command: string,
            loadSourcesFilePath: string | undefined,
            syncFilePath: string | undefined,
          ): Promise<CatalogSourceConfig | undefined> {
            if (command === 'load-sources') {
              if (loadSourcesFilePath === undefined) {
                throw new Error('catalog load-sources requires a source config file');
              }
              return loadCatalogSourceConfig(loadSourcesFilePath);
            }
            if (command === 'sync') {
              if (syncFilePath === undefined) {
                throw new Error('catalog sync requires --file <catalog-sources.yml>');
              }
              return loadCatalogSourceConfig(syncFilePath);
            }
            return undefined;
          }

          export function parseResumeFingerprint(
            value: string | undefined,
            resumeAfter: SyncCatalogResumeCursor | undefined,
          ): string | undefined {
            if (resumeAfter === undefined) {
              if (value !== undefined) throw new Error('--resume-fingerprint requires --resume-after');
              return undefined;
            }
            if (value === undefined) {
              throw new Error('--resume-after requires --resume-fingerprint from the previous sync output');
            }
            if (!RESUME_FINGERPRINT_PATTERN.test(value)) {
              throw new Error('--resume-fingerprint must be a SHA-256 hexadecimal value');
            }
            return value.toLowerCase();
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path('src/cli/catalog.ts')
          text = path.read_text()
          old_import = "import { loadCatalogSourceConfig, type CatalogSourceConfig } from './catalog-source-config.js';"
          new_import = """import {
            parseResumeFingerprint,
            preloadCatalogSourceConfig,
          } from './catalog-sync-preflight.js';"""
          if text.count(old_import) != 1:
              raise SystemExit('catalog.ts: expected catalog-source-config import exactly once')
          text = text.replace(old_import, new_import, 1)

          pattern_line = "const RESUME_FINGERPRINT_PATTERN = /^[a-fA-F0-9]{64}$/u;\n"
          if text.count(pattern_line) != 1:
              raise SystemExit('catalog.ts: expected resume fingerprint pattern exactly once')
          text = text.replace(pattern_line, '', 1)

          old_block = """  let catalogSourceConfig: CatalogSourceConfig | undefined;
          if (options.command === 'load-sources') {
            if (options.sourceConfig === undefined) throw new Error(usage());
            catalogSourceConfig = await loadCatalogSourceConfig(options.sourceConfig.filePath);
          } else if (options.command === 'sync') {
            if (options.sync === undefined) throw new Error(usage());
            if (options.sync.filePath === undefined) {
              throw new Error('catalog sync requires --file <catalog-sources.yml>');
            }
            catalogSourceConfig = await loadCatalogSourceConfig(options.sync.filePath);
          }
          """
          new_block = """  const catalogSourceConfig = await preloadCatalogSourceConfig(
            options.command,
            options.sourceConfig?.filePath,
            options.sync?.filePath,
          );
          """
          if text.count(old_block) != 1:
              raise SystemExit('catalog.ts: expected preloading block exactly once')
          text = text.replace(old_block, new_block, 1)

          start = text.index('\nfunction parseResumeFingerprint(')
          end = text.index('\nfunction parseSourceType(', start)
          text = text[:start] + '\n' + text[end:]
          path.write_text(text)

          test_path = Path('tests/application/sync-catalog-resume-fingerprint.test.ts')
          test = test_path.read_text()
          marker = """  it('rejects a reordered configuration before starting a sync run', async () => {"""
          start = test.index(marker)
          close = test.index('\n});\n\nfunction requireResumeCursor', start)
          additions = """

            it('rejects a fingerprint when no resume cursor is supplied', async () => {
              const repository = new ResumeRepository();
              const fetcher = new ResumeFetcher();

              await expect(
                new SyncCatalogDocuments(repository, fetcher, clock).execute({
                  sourceKey: source.sourceKey,
                  documents: [guide, api],
                  timeoutMs: 1_000,
                  maxResponseBytes: 10_000,
                  maxRedirects: 3,
                  resumeConfigurationFingerprint: 'a'.repeat(64),
                }),
              ).rejects.toThrow('CATALOG_RESUME_FINGERPRINT_WITHOUT_CURSOR');

              expect(repository.startCalls).toBe(0);
              expect(fetcher.calls).toBe(0);
            });

            it('rejects a resume cursor when its configuration fingerprint is missing', async () => {
              const repository = new ResumeRepository();
              const fetcher = new ResumeFetcher();

              await expect(
                new SyncCatalogDocuments(repository, fetcher, clock).execute({
                  sourceKey: source.sourceKey,
                  documents: [guide, api],
                  timeoutMs: 1_000,
                  maxResponseBytes: 10_000,
                  maxRedirects: 3,
                  resumeAfter: { sourceKey: source.sourceKey, stableKey: guide.stableKey },
                }),
              ).rejects.toThrow('CATALOG_RESUME_FINGERPRINT_REQUIRED');

              expect(repository.startCalls).toBe(0);
              expect(fetcher.calls).toBe(0);
            });

            it('rejects a malformed resume fingerprint before starting a sync run', async () => {
              const repository = new ResumeRepository();
              const fetcher = new ResumeFetcher();

              await expect(
                new SyncCatalogDocuments(repository, fetcher, clock).execute({
                  sourceKey: source.sourceKey,
                  documents: [guide, api],
                  timeoutMs: 1_000,
                  maxResponseBytes: 10_000,
                  maxRedirects: 3,
                  resumeAfter: { sourceKey: source.sourceKey, stableKey: guide.stableKey },
                  resumeConfigurationFingerprint: 'not-a-sha256',
                }),
              ).rejects.toThrow('CATALOG_RESUME_FINGERPRINT_INVALID');

              expect(repository.startCalls).toBe(0);
              expect(fetcher.calls).toBe(0);
            });
          """
          test_path.write_text(test[:close] + additions + test[close:])
          PY

          cat > tests/cli/catalog-sync-preflight.test.ts <<'EOF'
          import { mkdtempSync, rmSync, writeFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';

          import { afterEach, describe, expect, it } from 'vitest';

          import {
            parseResumeFingerprint,
            preloadCatalogSourceConfig,
          } from '../../src/cli/catalog-sync-preflight.js';

          const roots: string[] = [];
          const CURSOR = { sourceKey: 'openai', stableKey: 'overview' } as const;
          const VALID_CONFIG = `
          schema_version: 1
          sources:
            openai:
              display_name: OpenAI Docs
              base_url: https://platform.openai.com/docs/
              source_type: documentation
              language: en-US
              freshness_policy: daily
              sync_strategy: polling
              enabled: true
              documents:
                - stable_key: overview
                  title: Overview
                  url: https://platform.openai.com/docs/overview
                  language: en-US
                  mime_type: text/html
                  enabled: true
          `;

          afterEach(() => {
            roots.splice(0).forEach((root) => rmSync(root, { recursive: true, force: true }));
          });

          describe('catalog sync CLI preflight', () => {
            it('does nothing for commands that do not consume catalog source configuration', async () => {
              await expect(preloadCatalogSourceConfig('status', undefined, undefined)).resolves.toBeUndefined();
            });

            it('preloads load-sources configuration before repository construction', async () => {
              const filePath = createConfig();
              await expect(
                preloadCatalogSourceConfig('load-sources', filePath, undefined),
              ).resolves.toMatchObject({
                sources: [{ sourceKey: 'openai' }],
                documents: [{ sourceKey: 'openai', stableKey: 'overview' }],
              });
            });

            it('preloads sync configuration before repository construction', async () => {
              const filePath = createConfig();
              await expect(preloadCatalogSourceConfig('sync', undefined, filePath)).resolves.toMatchObject({
                documents: [{ sourceKey: 'openai', stableKey: 'overview' }],
              });
            });

            it('fails closed when sync has no source config file', async () => {
              await expect(preloadCatalogSourceConfig('sync', undefined, undefined)).rejects.toThrow(
                'catalog sync requires --file <catalog-sources.yml>',
              );
            });

            it('fails closed when load-sources has no source config file', async () => {
              await expect(preloadCatalogSourceConfig('load-sources', undefined, undefined)).rejects.toThrow(
                'catalog load-sources requires a source config file',
              );
            });

            it('requires the resume cursor and fingerprint as one atomic pair', () => {
              expect(parseResumeFingerprint(undefined, undefined)).toBeUndefined();
              expect(() => parseResumeFingerprint('a'.repeat(64), undefined)).toThrow(
                '--resume-fingerprint requires --resume-after',
              );
              expect(() => parseResumeFingerprint(undefined, CURSOR)).toThrow(
                '--resume-after requires --resume-fingerprint from the previous sync output',
              );
            });

            it('rejects malformed fingerprints and normalizes valid hexadecimal input', () => {
              expect(() => parseResumeFingerprint('not-a-sha256', CURSOR)).toThrow(
                '--resume-fingerprint must be a SHA-256 hexadecimal value',
              );
              expect(parseResumeFingerprint('A'.repeat(64), CURSOR)).toBe('a'.repeat(64));
            });
          });

          function createConfig(): string {
            const root = mkdtempSync(join(tmpdir(), 'mcp-catalog-preflight-'));
            roots.push(root);
            const filePath = join(root, 'catalog-sources.yml');
            writeFileSync(filePath, VALID_CONFIG, 'utf8');
            return filePath;
          }
          EOF

          npx prettier --write \
            src/cli/catalog.ts \
            src/cli/catalog-sync-preflight.ts \
            tests/application/sync-catalog-resume-fingerprint.test.ts \
            tests/cli/catalog-sync-preflight.test.ts
          npm run typecheck
          npx vitest run tests/cli/catalog-sync-preflight.test.ts tests/application/sync-catalog-resume-fingerprint.test.ts
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/cli/catalog.ts \
            src/cli/catalog-sync-preflight.ts \
            tests/application/sync-catalog-resume-fingerprint.test.ts \
            tests/cli/catalog-sync-preflight.test.ts
          git commit -m 'test: cover catalog sync preflight and resume guards'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
