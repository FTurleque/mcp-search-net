name: Local Embeddings Benchmark

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  benchmark:
    if: github.head_ref == 'agent/full-audit-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.data/huggingface
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Check out exact benchmark head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'

      - name: Install product dependencies with explicit lifecycle policy
        run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3 --foreground-scripts
          npm run check:supply-chain

      - name: Build product
        run: npm run build

      - name: Run exact product FTS baseline on reinforced queries
        run: >-
          node scripts/benchmark-v2-search-quality.mjs
          --output .data/test-reports/v2-search-quality-current.json
          --warmup-rounds 1
          --repetitions 3

      - name: Install research-only embedding dependencies
        run: python -m pip install --disable-pip-version-check model2vec==0.8.2 numpy==2.5.1

      - name: Run local embeddings comparison
        run: >-
          python scripts/benchmark-local-embeddings.py
          --output .data/test-reports/local-embeddings-benchmark.json
          --warmup-rounds 1
          --repetitions 5

      - name: Record exact benchmark head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > .data/test-reports/local-embeddings-exact-head.txt

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-embeddings-benchmark
          path: .data/test-reports
