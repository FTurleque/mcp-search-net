name: Publish Windows Release

on:
  # Publication volontaire uniquement. Ce workflow n'est jamais déclenché par
  # un push ou une pull request. Sur master il publie ; sur toute autre branche
  # il qualifie seulement les artefacts demandés.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version SemVer à qualifier/publier, par exemple 1.1.0 ou 1.1.1-rc1'
        required: true
        default: '1.1.0'
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, smoke-test et publication Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Installer Inno Setup 6.7.1
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          $iscc = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe',
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\ProgramData\chocolatey\bin\ISCC.exe'
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe introuvable après installation Inno Setup.' }
          $isccVersion = (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($isccVersion) -or -not $isccVersion.StartsWith('6.7.1', [System.StringComparison]::Ordinal)) {
            throw "Version ISCC inattendue : $isccVersion ($iscc)"
          }
          Write-Host "ISCC: $iscc ($isccVersion)"

      - name: Télécharger le runtime Node.js win-x64 pour bundling
        shell: pwsh
        run: |
          $uri = 'https://nodejs.org/dist/v24.18.0/node-v24.18.0-win-x64.zip'
          $sha = '0ae68406b42d7725661da979b1403ec9926da205c6770827f33aac9d8f26e821'
          Invoke-WebRequest -Uri $uri -OutFile node-runtime.zip -UseBasicParsing
          $actual = (Get-FileHash node-runtime.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $sha) { throw "SHA-256 archive Node.js incorrect : $actual" }
          Write-Host "Node.js win-x64 vérifié : $sha"

      - name: Afficher la toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          gh --version
          git rev-parse HEAD
          Write-Host "Ref: $env:GITHUB_REF"
          Write-Host "SHA: $env:GITHUB_SHA"

      - name: Qualifier la release (branche non-master)
        if: github.ref != 'refs/heads/master'
        shell: pwsh
        run: |
          .\scripts\release\publish-windows-release.ps1 `
            -Version '${{ inputs.version }}' `
            -NodeZipPath '.\node-runtime.zip' `
            -TargetCommit '${{ github.sha }}' `
            -ValidateOnly

      - name: Construire, qualifier et publier la GitHub Release (master)
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          .\scripts\release\publish-windows-release.ps1 `
            -Version '${{ inputs.version }}' `
            -NodeZipPath '.\node-runtime.zip' `
            -TargetCommit '${{ github.sha }}'

      - name: Conserver les artefacts du run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-search-net-${{ inputs.version }}-windows-x64
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/dist/mcp-search-net-${{ inputs.version }}-windows-x64-setup.exe
            target/dist/mcp-search-net-${{ inputs.version }}-windows-x64-setup.exe.sha256
            target/dist/mcp-search-net-${{ inputs.version }}-windows-x64.zip
            target/dist/mcp-search-net-${{ inputs.version }}-windows-x64.zip.sha256
            target/dist/THIRD-PARTY-NOTICES-${{ inputs.version }}.txt
            target/dist/THIRD-PARTY-NOTICES-${{ inputs.version }}.txt.sha256
