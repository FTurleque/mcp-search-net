name: Temporary PDF.js Security Update

on:
  push:
    branches:
      - agent/post-audit-release-qualification

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/post-audit-release-qualification
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Regenerate lockfile with fixed PDF.js
        run: npm install pdfjs-dist@6.2.108 --save-exact --package-lock-only --ignore-scripts

      - name: Verify dependency versions
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.dependencies['pdfjs-dist']!=='6.2.108'||l.packages['node_modules/pdfjs-dist'].version!=='6.2.108') process.exit(1)"

      - name: Install and validate security update
        run: |
          npm ci
          npm run check
          npm audit --audit-level=moderate
          npm audit --omit=dev --audit-level=moderate

      - name: Commit verified dependency update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet && { echo 'NO_DEPENDENCY_CHANGES'; exit 0; }
          git commit -m 'fix: upgrade pdfjs-dist for malicious PDF advisory'
          git push origin HEAD:agent/post-audit-release-qualification
