name: Catalog backup durability

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - src/infrastructure/catalog/sqlite-catalog-backup.ts
      - tests/infrastructure/sqlite-catalog-backup-durability.test.ts
      - tests/infrastructure/sqlite-catalog-backup-commit-point.test.ts
      - .github/workflows/catalog-backup-durability.yml
  push:
    branches:
      - master
      - develop
    paths:
      - src/infrastructure/catalog/sqlite-catalog-backup.ts
      - tests/infrastructure/sqlite-catalog-backup-durability.test.ts
      - tests/infrastructure/sqlite-catalog-backup-commit-point.test.ts
      - .github/workflows/catalog-backup-durability.yml

permissions:
  contents: read

concurrency:
  group: catalog-backup-durability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-backup-durability:
    name: Windows backup durability
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run catalog backup durability tests
        run: npx --no-install vitest run tests/infrastructure/sqlite-catalog-backup-durability.test.ts tests/infrastructure/sqlite-catalog-backup-commit-point.test.ts

      - name: Record exact head
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:QUALIFIED_SHA) {
            throw "Unexpected qualified head: $actual"
          }
          Write-Host "CATALOG_BACKUP_DURABILITY_QUALIFIED_SHA=$actual"
