name: Formatting Probe

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'agent/full-audit-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Generate canonical Prettier output
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          git diff --binary > format.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prettier-formatted-sources
          path: |
            format.patch
            src/infrastructure/catalog/*.ts
            src/infrastructure/fetch/*.ts
