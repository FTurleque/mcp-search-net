name: Native client certification smoke

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/certify-native-clients.ps1
      - scripts/validate-native-client-certification-wiring.ps1
      - packaging/windows/configure-install.ps1
      - docs/planning/client-certification-current.md
      - .github/workflows/native-client-certification-smoke.yml
  workflow_dispatch:

env:
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-powershell-51:
    name: Windows PowerShell 5.1 certification harness
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Validate certification and client wiring with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\validate-native-client-certification-wiring.ps1

      - name: Run non-destructive smoke collection
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'native-client-certification-smoke'
          .\scripts\certify-native-clients.ps1 -SmokeMode -OutputDirectory $output
          $report = Get-Content -LiteralPath (Join-Path $output 'native-client-certification.json') -Raw | ConvertFrom-Json
          if ($report.schemaVersion -ne '1.0') { throw 'Unexpected certification schema version.' }
          $clientCount = @($report.clients).Count
          if ($clientCount -ne 3) { throw "Expected three certification clients, got $clientCount." }
          $expectedNames = @('Claude Code', 'Claude Desktop', 'Codex')
          foreach ($name in $expectedNames) {
            if (@($report.clients | Where-Object { $_.name -eq $name }).Count -ne 1) {
              throw "Missing retained certification client: $name"
            }
          }
          if (@($report.clients | Where-Object { $_.verdict -ne 'NON_OBSERVE' }).Count -ne 0) {
            throw 'Smoke collector must never infer a native PASS.'
          }
          if (-not $report.host.osArchitecture) { throw 'OS architecture must be present.' }
          if (-not $report.host.powershellVersion) { throw 'PowerShell version must be present.' }
          Write-Host "NATIVE_CLIENT_CERTIFICATION_SMOKE_VALID arch=$($report.host.osArchitecture) powershell=$($report.host.powershellVersion)"

      - name: Record exact head
        shell: powershell
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:QUALIFIED_SHA) {
            throw "Unexpected qualified head: $actual"
          }
          Write-Host "NATIVE_CLIENT_CERTIFICATION_QUALIFIED_SHA=$actual"
