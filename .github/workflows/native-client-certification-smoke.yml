name: Native client certification smoke

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/certify-native-clients.ps1
      - scripts/validate-native-client-certification-wiring.ps1
      - packaging/windows/configure-install.ps1
      - docs/planning/client-certification-current.md
      - .github/workflows/native-client-certification-smoke.yml
  workflow_dispatch:

env:
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-powershell-51:
    name: Windows PowerShell 5.1 certification harness
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Validate certification and client wiring with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\validate-native-client-certification-wiring.ps1

      - name: Run non-destructive smoke collection
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'native-client-certification-smoke'
          $raw = @(\.\scripts\certify-native-clients.ps1 -SmokeMode -OutputDirectory $output)
          $report = (($raw | ForEach-Object { [string]$_ }) -join [Environment]::NewLine) | ConvertFrom-Json
          if ($report.schemaVersion -ne '1.0') { throw 'Unexpected certification schema version.' }
          if ($report.mode -ne 'smoke') { throw "Unexpected certification mode: $($report.mode)" }

          $expectedNames = @('Claude Code', 'Claude Desktop', 'Codex')
          $scope = @($report.certificationScope)
          if ($scope.Count -ne $expectedNames.Count) {
            throw "Expected three certification clients, got $($scope.Count)."
          }
          foreach ($name in $expectedNames) {
            if (@($scope | Where-Object { $_ -eq $name }).Count -ne 1) {
              throw "Missing retained certification client: $name"
            }
          }

          $expectedExcluded = @('IntelliJ IDEA + GitHub Copilot', 'GitHub Copilot CLI')
          $excluded = @($report.excludedClients)
          if ($excluded.Count -ne $expectedExcluded.Count) {
            throw "Expected two excluded compatibility clients, got $($excluded.Count)."
          }
          foreach ($name in $expectedExcluded) {
            if (@($excluded | Where-Object { $_ -eq $name }).Count -ne 1) {
              throw "Missing excluded compatibility client: $name"
            }
          }

          if ($null -ne $report.reportPath) { throw 'Smoke collection must not persist a certification report.' }
          if (-not (Test-Path -LiteralPath $output -PathType Container)) { throw 'Smoke output directory was not created.' }
          if (@(Get-ChildItem -LiteralPath $output -File -ErrorAction Stop).Count -ne 0) {
            throw 'Smoke collection must not persist certification evidence files.'
          }

          Write-Host "NATIVE_CLIENT_CERTIFICATION_SMOKE_VALID detected=$($report.detected) configured=$($report.configured)"

      - name: Record exact head
        shell: powershell
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:QUALIFIED_SHA) {
            throw "Unexpected qualified head: $actual"
          }
          Write-Host "NATIVE_CLIENT_CERTIFICATION_QUALIFIED_SHA=$actual"
