name: Native client certification smoke

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/patch-native-client-path-confinement.ps1
      - packaging/windows/configure-install.ps1
      - .github/workflows/native-client-certification-smoke.yml
  workflow_dispatch:

env:
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  apply-path-confinement:
    name: Apply native client path confinement patch
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: true

      - name: Apply patch with Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\patch-native-client-path-confinement.ps1

      - name: Commit generated patch and restore smoke
        shell: powershell
        run: |
          git fetch origin master:refs/remotes/origin/master --depth=1
          git checkout origin/master -- .github/workflows/native-client-certification-smoke.yml
          git rm scripts/patch-native-client-path-confinement.ps1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/windows/configure-install.ps1 .github/workflows/native-client-certification-smoke.yml
          git commit -m 'Pin managed native client config and catalog paths'
          git push origin "HEAD:${{ github.head_ref }}"
