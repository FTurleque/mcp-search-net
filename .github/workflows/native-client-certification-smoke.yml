name: Native client certification smoke

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/certify-native-clients.ps1
      - packaging/windows/configure-install.ps1
      - docs/planning/client-certification-current.md
      - .github/workflows/native-client-certification-smoke.yml
  workflow_dispatch:

env:
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-powershell-51:
    name: Windows PowerShell 5.1 certification harness
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Parse certification and client wiring with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            'scripts\certify-native-clients.ps1',
            'packaging\windows\configure-install.ps1'
          )
          foreach ($path in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if (@($parseErrors).Count -gt 0) {
              $details = @($parseErrors | ForEach-Object {
                "line=$($_.Extent.StartLineNumber) col=$($_.Extent.StartColumnNumber) text=[$($_.Extent.Text)] message=$($_.Message)"
              }) -join '; '
              throw "PowerShell parse failed for ${path}: $details"
            }
          }

          $configure = Get-Content -LiteralPath 'packaging\windows\configure-install.ps1' -Raw
          if ($configure -notmatch "'add-json', '--scope', 'user'") { throw 'Claude Code add-json user-scope wiring is missing.' }
          if (-not $configure.Contains("'.copilot\mcp-config.json'")) { throw 'Copilot CLI user config path is missing.' }
          if ($configure -notmatch '\$CopilotCliEntry') { throw 'Copilot CLI deterministic JSON entry is missing.' }
          if ($configure -match '\$copilotAddArgs') { throw 'Legacy Copilot CLI mcp add wiring must not return.' }
          if ($configure -match '\$claudeAddArgs') { throw 'Legacy Claude Code mcp add wiring must not return.' }
          if ($configure -notmatch "'mcp', 'get', 'mcp-search-net', '--json'") { throw 'Copilot CLI post-write verification is missing.' }
          if ($configure -notmatch 'Test-NativeServerOutput') { throw 'Native server verification is missing.' }

          if ($configure -notmatch 'function New-ManagedClientEnv') { throw 'Managed client environment helper is missing.' }
          foreach ($requiredPathVariable in @('MCP_SEARCH_HOME', 'MCP_CONFIG_PATH', 'MCP_CATALOG_PATH')) {
            if ($configure -notmatch [regex]::Escape($requiredPathVariable)) {
              throw "Managed client path variable is missing: $requiredPathVariable"
            }
          }
          $managedEnvUses = [regex]::Matches($configure, 'env\s+=\s+\(New-ManagedClientEnv\)').Count
          if ($managedEnvUses -lt 5) { throw "Expected at least five confined stdio env uses, got $managedEnvUses." }
          if ($configure -match '\$listed\s+-and\s+\$alreadyManaged') {
            throw 'Managed CLI entries must be rewritten, not accepted only because mcp get succeeds.'
          }
          if ($configure -notmatch '\$configEnvLine' -or $configure -notmatch '\$catalogEnvLine') {
            throw 'Codex config/catalog path confinement is missing.'
          }
          Write-Host "NATIVE_CLIENT_CERTIFICATION_PARSE_VALID files=$($files.Count) confinedEnvUses=$managedEnvUses"

      - name: Run non-destructive smoke collection
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'native-client-certification-smoke'
          .\scripts\certify-native-clients.ps1 -SmokeMode -OutputDirectory $output
          $report = Get-Content -LiteralPath (Join-Path $output 'native-client-certification.json') -Raw | ConvertFrom-Json
          if ($report.schemaVersion -ne '1.0') { throw 'Unexpected certification schema version.' }
          $clientCount = @($report.clients).Count
          if ($clientCount -ne 5) { throw "Expected five clients, got $clientCount." }
          if (@($report.clients | Where-Object { $_.verdict -ne 'NON_OBSERVE' }).Count -ne 0) {
            throw 'Smoke collector must never infer a native PASS.'
          }
          if (-not $report.host.osArchitecture) { throw 'OS architecture must be present.' }
          if (-not $report.host.powershellVersion) { throw 'PowerShell version must be present.' }
          Write-Host "NATIVE_CLIENT_CERTIFICATION_SMOKE_VALID arch=$($report.host.osArchitecture) powershell=$($report.host.powershellVersion)"

      - name: Record exact head
        shell: powershell
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:QUALIFIED_SHA) {
            throw "Unexpected qualified head: $actual"
          }
          Write-Host "NATIVE_CLIENT_CERTIFICATION_QUALIFIED_SHA=$actual"
