name: Native client certification smoke

on:
  pull_request:
    branches:
      - master
    paths:
      - packaging/windows/configure-install.ps1
      - .github/workflows/native-client-certification-smoke.yml

permissions:
  contents: write

env:
  PATCH_BRANCH: fix/native-client-wiring-json
  PATCH_SOURCE_SHA: 680f2939ccffda626f047fd1dba417050ede497a

jobs:
  patch-native-wiring:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.PATCH_BRANCH }}
          fetch-depth: 8
          persist-credentials: true

      - name: Apply configure-install patch from recorded source
        shell: python
        run: |
          import os
          import subprocess

          source = subprocess.check_output(
              ['git', 'show', f"{os.environ['PATCH_SOURCE_SHA']}:.github/workflows/native-wiring-patch-temp.yml"],
              text=True,
              encoding='utf-8',
          )
          lines = source.splitlines()
          marker = lines.index('      - name: Patch native client wiring')
          run_line = next(i for i in range(marker + 1, len(lines)) if lines[i] == '        run: |')
          body = []
          for line in lines[run_line + 1:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif line == '':
                  body.append('')
              else:
                  raise SystemExit(f'Unexpected embedded patch line: {line!r}')
          code = '\n'.join(body) + '\n'
          smoke_marker = "\nsmoke = Path('.github/workflows/native-client-certification-smoke.yml')"
          if smoke_marker not in code:
              raise SystemExit('Embedded configure patch boundary not found')
          configure_only = code.split(smoke_marker, 1)[0] + '\n'
          exec(compile(configure_only, '<native-wiring-configure-patch>', 'exec'))

      - name: Validate Windows PowerShell syntax and diff
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'packaging/windows/configure-install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if (@($errors).Count -gt 0) {
            throw ((@($errors | ForEach-Object { "line=$($_.Extent.StartLineNumber) col=$($_.Extent.StartColumnNumber) $($_.Message)" })) -join '; ')
          }
          git diff --check
          if (-not (git diff --name-only | Select-String -SimpleMatch 'packaging/windows/configure-install.ps1')) {
            throw 'configure-install.ps1 was not changed.'
          }

      - name: Commit generated configure patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/windows/configure-install.ps1
          git commit -m 'Make native CLI MCP wiring deterministic'
          git push origin "HEAD:${PATCH_BRANCH}"
