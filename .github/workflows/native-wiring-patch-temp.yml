name: Temporary native wiring patch

on:
  push:
    branches:
      - fix/native-client-wiring-json
    paths:
      - .github/workflows/native-wiring-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/native-client-wiring-json
          fetch-depth: 2
          persist-credentials: true

      - name: Execute patch embedded in parent workflow
        shell: python
        run: |
          import subprocess
          source = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/native-wiring-patch-temp.yml'],
              text=True,
              encoding='utf-8',
          )
          lines = source.splitlines()
          marker = lines.index('      - name: Patch native client wiring')
          run_line = next(i for i in range(marker + 1, len(lines)) if lines[i] == '        run: |')
          body = []
          for line in lines[run_line + 1:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif line == '':
                  body.append('')
              else:
                  raise SystemExit(f'Unexpected embedded patch line: {line!r}')
          code = '\n'.join(body) + '\n'
          exec(compile(code, '<embedded-native-wiring-patch>', 'exec'))

      - name: Validate generated patch
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'packaging/windows/configure-install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if (@($errors).Count -gt 0) {
            throw ((@($errors | ForEach-Object { "line=$($_.Extent.StartLineNumber) $($_.Message)" })) -join '; ')
          }
          git diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/native-wiring-patch-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/windows/configure-install.ps1 .github/workflows/native-client-certification-smoke.yml .github/workflows/native-wiring-patch-temp.yml
          git commit -m 'Make native CLI MCP wiring deterministic'
          git push origin HEAD:fix/native-client-wiring-json
