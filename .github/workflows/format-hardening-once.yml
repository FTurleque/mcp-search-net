name: Format hardening branch once

on:
  push:
    branches:
      - agent/hardening-reconciliation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/hardening-reconciliation
          persist-credentials: true
      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier configuration
        run: npx prettier --write tests/infrastructure/secure-http-gateway.test.ts
      - name: Commit formatted file when needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/infrastructure/secure-http-gateway.test.ts
          git commit -m 'style: apply repository Prettier output'
          git push origin HEAD:agent/hardening-reconciliation
