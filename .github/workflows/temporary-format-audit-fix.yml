name: Temporary format audit fix sources

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/fix-audit-followup-20260816'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format and push only the two audited source files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npx prettier --write src/cli/catalog.ts src/infrastructure/locking/file-lease-lock.ts
          git add src/cli/catalog.ts src/infrastructure/locking/file-lease-lock.ts
          if git diff --cached --quiet; then
            echo "Sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply locked prettier output"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_HEAD_REF}
