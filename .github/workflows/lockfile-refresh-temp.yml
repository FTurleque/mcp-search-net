name: Temporary lockfile refresh

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/lockfile-refresh-temp.yml

permissions:
  contents: write

env:
  EXPECTED_NANOID: 3.3.18

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Refresh vulnerable transitive lock entry
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/package.json.before"
          npm audit fix --package-lock-only --ignore-scripts
          cmp -s package.json "$RUNNER_TEMP/package.json.before"
          changed="$(git diff --name-only)"
          test "$changed" = "package-lock.json"
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const version = lock.packages?.['node_modules/nanoid']?.version;
          if (version !== process.env.EXPECTED_NANOID) {
            throw new Error(`Expected nanoid ${process.env.EXPECTED_NANOID}, got ${version}`);
          }
          NODE
          npm audit --audit-level=moderate

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh nanoid lock to 3.3.18'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
