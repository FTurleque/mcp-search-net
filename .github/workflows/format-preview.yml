name: Temporary format preview

on:
  push:
    branches:
      - fix/audit-remediation-final-2026-08-12

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            src/application/use-cases/sync-catalog-documents.ts \
            tests/application/final-audit-catalog-reconciliation-2026-08-12.test.ts
          git diff -- \
            src/application/use-cases/sync-catalog-documents.ts \
            tests/application/final-audit-catalog-reconciliation-2026-08-12.test.ts
