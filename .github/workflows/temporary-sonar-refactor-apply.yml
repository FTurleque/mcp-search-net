name: Temporary Sonar refactor apply

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 102 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Integrate preflight module and add fail-closed coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/cli/catalog.ts')
          text = path.read_text()
          old_import = "import { loadCatalogSourceConfig, type CatalogSourceConfig } from './catalog-source-config.js';"
          new_import = """import {
            parseResumeFingerprint,
            preloadCatalogSourceConfig,
          } from './catalog-sync-preflight.js';"""
          if text.count(old_import) != 1:
              raise SystemExit('catalog.ts: source config import not found exactly once')
          text = text.replace(old_import, new_import, 1)

          pattern = "const RESUME_FINGERPRINT_PATTERN = /^[a-fA-F0-9]{64}$/u;\n"
          if text.count(pattern) != 1:
              raise SystemExit('catalog.ts: fingerprint pattern not found exactly once')
          text = text.replace(pattern, '', 1)

          start_marker = '  let catalogSourceConfig: CatalogSourceConfig | undefined;'
          end_marker = '\n\n  const repository = new SqliteCatalogRepository(options.path, clock);'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = """  const catalogSourceConfig = await preloadCatalogSourceConfig(
            options.command,
            options.sourceConfig?.filePath,
            options.sync?.filePath,
          );"""
          text = text[:start] + replacement + text[end:]

          start = text.index('\nfunction parseResumeFingerprint(')
          end = text.index('\nfunction parseSourceType(', start)
          text = text[:start] + '\n' + text[end:]
          path.write_text(text)

          test_path = Path('tests/application/sync-catalog-resume-fingerprint.test.ts')
          test = test_path.read_text()
          close_marker = '\n});\n\nfunction requireResumeCursor'
          close = test.index(close_marker)
          additions = """

            it('rejects a fingerprint when no resume cursor is supplied', async () => {
              const repository = new ResumeRepository();
              const fetcher = new ResumeFetcher();

              await expect(
                new SyncCatalogDocuments(repository, fetcher, clock).execute({
                  sourceKey: source.sourceKey,
                  documents: [guide, api],
                  timeoutMs: 1_000,
                  maxResponseBytes: 10_000,
                  maxRedirects: 3,
                  resumeConfigurationFingerprint: 'a'.repeat(64),
                }),
              ).rejects.toThrow('CATALOG_RESUME_FINGERPRINT_WITHOUT_CURSOR');

              expect(repository.startCalls).toBe(0);
              expect(fetcher.calls).toBe(0);
            });

            it('rejects a resume cursor when its configuration fingerprint is missing', async () => {
              const repository = new ResumeRepository();
              const fetcher = new ResumeFetcher();

              await expect(
                new SyncCatalogDocuments(repository, fetcher, clock).execute({
                  sourceKey: source.sourceKey,
                  documents: [guide, api],
                  timeoutMs: 1_000,
                  maxResponseBytes: 10_000,
                  maxRedirects: 3,
                  resumeAfter: { sourceKey: source.sourceKey, stableKey: guide.stableKey },
                }),
              ).rejects.toThrow('CATALOG_RESUME_FINGERPRINT_REQUIRED');

              expect(repository.startCalls).toBe(0);
              expect(fetcher.calls).toBe(0);
            });

            it('rejects a malformed resume fingerprint before starting a sync run', async () => {
              const repository = new ResumeRepository();
              const fetcher = new ResumeFetcher();

              await expect(
                new SyncCatalogDocuments(repository, fetcher, clock).execute({
                  sourceKey: source.sourceKey,
                  documents: [guide, api],
                  timeoutMs: 1_000,
                  maxResponseBytes: 10_000,
                  maxRedirects: 3,
                  resumeAfter: { sourceKey: source.sourceKey, stableKey: guide.stableKey },
                  resumeConfigurationFingerprint: 'not-a-sha256',
                }),
              ).rejects.toThrow('CATALOG_RESUME_FINGERPRINT_INVALID');

              expect(repository.startCalls).toBe(0);
              expect(fetcher.calls).toBe(0);
            });
          """
          if "rejects a fingerprint when no resume cursor is supplied" in test:
              raise SystemExit('resume guard tests already inserted')
          test_path.write_text(test[:close] + additions + test[close:])
          PY
          npx prettier --write \
            src/cli/catalog.ts \
            src/cli/catalog-sync-preflight.ts \
            tests/cli/catalog-sync-preflight.test.ts \
            tests/application/sync-catalog-resume-fingerprint.test.ts
          npm run typecheck
          npx vitest run tests/cli/catalog-sync-preflight.test.ts tests/application/sync-catalog-resume-fingerprint.test.ts
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/cli/catalog.ts \
            src/cli/catalog-sync-preflight.ts \
            tests/cli/catalog-sync-preflight.test.ts \
            tests/application/sync-catalog-resume-fingerprint.test.ts
          git commit -m 'test: cover catalog sync preflight and resume guards'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
