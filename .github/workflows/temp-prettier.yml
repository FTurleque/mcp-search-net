name: Temporary Prettier Repair

on:
  push:
    branches:
      - fix/final-audit-hardening-20260813

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/final-audit-hardening-20260813

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository Prettier
        run: >-
          npx prettier --write
          scripts/check-supply-chain.mjs
          src/infrastructure/fetch/html-document-extractor.ts
          tests/security/windows-installer-integrity.test.ts

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet --exit-code; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git add scripts/check-supply-chain.mjs src/infrastructure/fetch/html-document-extractor.ts tests/security/windows-installer-integrity.test.ts
          git commit -m 'style: apply repository Prettier'
          git push origin HEAD:fix/final-audit-hardening-20260813
