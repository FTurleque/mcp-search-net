name: One-shot Audit Remediation Cleanup

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/audit-remediation-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact remediation head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Wait until validated Node fix is present
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'const absoluteTimer = setTimeout(() => {' src/infrastructure/fetch/secure-http-gateway.ts \
            && grep -Fq 'returned an empty response body' src/infrastructure/http/http-utils.ts \
            && grep -Fq "createTransport('https://user:secret@example.com/docs')" tests/domain/value-objects.test.ts \
            && grep -Fq "rejects an empty provider response body" tests/infrastructure/http-utils.test.ts; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'NODE_FIX_NOT_PRESENT_YET'
          fi

      - name: Validate final Node gates before cleanup
        if: steps.ready.outputs.ready == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test:coverage

      - name: Remove all one-shot workflows and push cleanup
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/one-shot-node-diagnostics.yml \
            .github/workflows/one-shot-node-fix.yml \
            .github/workflows/one-shot-remediation-cleanup.yml
          git commit -m 'chore: remove one-shot audit workflows'
          git push origin "HEAD:${{ github.head_ref }}"
