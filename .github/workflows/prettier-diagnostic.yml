name: Prettier diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  diagnostic:
    name: Exact Prettier diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          target='tests/security/windows-upgrade-contract.test.ts'
          formatted="$RUNNER_TEMP/windows-upgrade-contract.formatted.ts"
          npx --no-install prettier "$target" > "$formatted"
          diff -u "$target" "$formatted" || true
