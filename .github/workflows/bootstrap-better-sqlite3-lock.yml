name: Bootstrap better-sqlite3 lockfile

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org

      - name: Verify N-API dependency graph
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const better = lock.packages?.['node_modules/better-sqlite3'];
          if (better?.version !== '13.0.3') throw new Error(`unexpected better-sqlite3 version: ${better?.version}`);
          if (better?.hasInstallScript === true) throw new Error('better-sqlite3 still declares an install script');
          if (!lock.packages?.['node_modules/node-addon-api']) throw new Error('node-addon-api missing');
          if (lock.packages?.['node_modules/prebuild-install']) throw new Error('prebuild-install still present');
          NODE

      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: better-sqlite3-13-lockfile
          path: package-lock.json
          if-no-files-found: error
