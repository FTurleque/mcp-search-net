name: Bootstrap better-sqlite3 lockfile

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org

      - name: Verify N-API dependency graph
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const better = lock.packages?.['node_modules/better-sqlite3'];
          if (better?.version !== '13.0.3') throw new Error(`unexpected better-sqlite3 version: ${better?.version}`);
          if (better?.hasInstallScript === true) throw new Error('better-sqlite3 still declares an install script');
          if (!lock.packages?.['node_modules/node-addon-api']) throw new Error('node-addon-api missing');
          if (lock.packages?.['node_modules/prebuild-install']) throw new Error('prebuild-install still present');
          NODE

      - name: Commit generated lockfile to PR branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate lockfile for better-sqlite3 13'
          git push origin "HEAD:${HEAD_BRANCH}"
