name: One-shot Prettier Remediation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/audit-remediation-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact remediation head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install formatter dependencies
        run: npm ci --ignore-scripts

      - name: Apply repository Prettier configuration
        run: npx prettier --write .

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'PRETTIER_ALREADY_CLEAN'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'style: apply exact Prettier output'
          git push origin "HEAD:${{ github.head_ref }}"
