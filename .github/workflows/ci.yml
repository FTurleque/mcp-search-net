name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node.js 24 validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint sources
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run required suite without skips
        run: npm run test:required

      - name: Run security suite
        run: npm run test:security

      - name: Run unit and contract suites
        run: npm run test:unit && npm run test:contract

      - name: Run resilience suite
        run: npm run test:resilience

      - name: Run performance suite
        run: npm run test:performance

      - name: Upload deterministic reports
        if: always()
        uses: actions/upload-artifact@ea0d9a1af285e20c14bf34ee2e3a192a5e2e3c8b # v4.5.0
        with:
          name: deterministic-test-reports
          path: .data/test-reports

  integration:
    name: Docker integration and live E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build MCP container
        run: docker compose build mcp-search-net
      - name: Start real providers
        run: docker compose up -d --wait searxng crawl4ai
      - name: Run integration suite
        run: npm run test:integration
      - name: Run live MCP E2E suite
        run: npm run test:e2e
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@ea0d9a1af285e20c14bf34ee2e3a192a5e2e3c8b # v4.5.0
        with:
          name: integration-test-reports
          path: .data/test-reports
      - name: Collect provider logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop providers
        if: always()
        run: docker compose down
