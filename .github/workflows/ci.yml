name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node.js 24 validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint sources
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run required suite without skips
        run: npm run test:required

      - name: Run E2E deterministic suite (STDIO, tools/list, SSRF, stdout/stderr)
        run: npm run test:e2e:deterministic

      - name: Run security suite
        run: npm run test:security

      - name: Run unit and contract suites
        run: npm run test:unit && npm run test:contract

      - name: Run resilience suite
        run: npm run test:resilience

      - name: Run performance suite
        run: npm run test:performance

      - name: Upload deterministic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-test-reports
          path: .data/test-reports

  integration:
    name: Docker integration and live E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build MCP container
        run: docker compose build mcp-search-net
      - name: Start real providers
        run: docker compose up -d --wait searxng crawl4ai
      - name: Run integration suite
        run: npm run test:integration
      - name: Run live MCP E2E suite
        run: npm run test:e2e
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-reports
          path: .data/test-reports
      - name: Collect provider logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop providers
        if: always()
        run: docker compose down
