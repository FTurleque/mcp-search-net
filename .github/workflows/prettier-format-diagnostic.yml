name: Prettier format diagnostic

on:
  pull_request:
    branches:
      - develop
    paths:
      - tests/security/windows-upgrade-contract.test.ts
      - .github/workflows/prettier-format-diagnostic.yml

permissions:
  contents: read

env:
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Print exact Prettier 3.6.2 output
        shell: bash
        run: |
          npx --no-install prettier --write tests/security/windows-upgrade-contract.test.ts
          echo '===PRETTIER_OUTPUT_BEGIN==='
          cat tests/security/windows-upgrade-contract.test.ts
          echo '===PRETTIER_OUTPUT_END==='
          npx --no-install prettier --check tests/security/windows-upgrade-contract.test.ts
