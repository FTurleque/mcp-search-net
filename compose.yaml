name: mcp-search-net

services:
  searxng:
    # SearXNG 2026.6.20-fd42d4fda, validated on 2026-06-21.
    image: docker.io/searxng/searxng@sha256:d0f6ccf9d3faab5bba07bb6bbeb533c47dd4ace648ed5a0f8830e10eb96b7082
    restart: unless-stopped
    ports:
      - '127.0.0.1:8888:8080'
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-development-secret-change-me}
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8080/search?q=health&format=json'', timeout=5)"',
        ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - egress

  crawl4ai:
    image: unclecode/crawl4ai@sha256:385042cba2a216c257ccb77b0135dec5228ee25bf675edbc7487eb155bd5e644
    restart: unless-stopped
    ports:
      - '127.0.0.1:11235:11235'
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-mcp-search-local-development-token}
    shm_size: 1gb
    volumes:
      - crawl4ai-data:/home/appuser/.cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:11235/health'', timeout=5)"',
        ]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 60s
    networks:
      - backend
      - egress

  # mcp-search-net est un serveur MCP STDIO pur et n'expose pas
  # d'endpoint HTTP de santé. Les conditions service_healthy garantissent
  # uniquement la disponibilité de SearXNG et Crawl4AI avant son démarrage.
  # La santé fonctionnelle du serveur MCP est validée par les suites
  # test:e2e:deterministic et test:e2e:live : démarrage STDIO, tools/list
  # et appels réels des outils.
  mcp-search-net:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-search-net:1.0.0
    stdin_open: true
    tty: false
    environment:
      MCP_CONFIG_PATH: /app/config/application.docker.yml
      MCP_CRAWL4AI_TOKEN: ${CRAWL4AI_API_TOKEN:-mcp-search-local-development-token}
    volumes:
      - ./config/application.docker.yml:/app/config/application.docker.yml:ro
      - ./config/official-sources.yml:/app/config/official-sources.yml:ro
      - mcp-cache:/app/.data
    depends_on:
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - egress

volumes:
  searxng-cache:
  crawl4ai-data:
  mcp-cache:

networks:
  backend:
    internal: true
  egress:
