name: mcp-search-net

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8888:8080'
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8080/search?q=health&format=json'', timeout=5)"',
        ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s

  crawl4ai:
    image: unclecode/crawl4ai:0.9.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:11235:11235'
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-mcp-search-local-development-token}
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:11235/health'', timeout=5)"',
        ]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 60s

volumes:
  searxng-cache:
