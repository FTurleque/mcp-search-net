application:
  name: mcp-search-net
  version: 1.0.0
  profile: development

searxng:
  baseUrl: http://127.0.0.1:8888
  timeoutMs: 15000

crawl4ai:
  baseUrl: http://127.0.0.1:11235
  timeoutMs: 20000
  apiTokenEnvironmentVariable: MCP_CRAWL4AI_TOKEN

cache:
  enabled: true
  continueOnError: true
  path: ../.data/cache.sqlite
  searchTtlMs: 3600000
  documentationTtlMs: 86400000
  readmeTtlMs: 21600000
  sitemapTtlMs: 86400000
  staleRetentionMs: 604800000
  maxEntries: 2000

limits:
  defaultSearchResults: 5
  maxSearchResults: 10
  providerOversampling: 3
  maxSnippetChars: 500
  defaultFetchChars: 12000
  maxFetchChars: 30000
  defaultFetchSections: 5
  maxFetchSections: 10
  maxLinks: 50

security:
  allowedPorts: [80, 443]
  allowHttp: true
  maxDownloadBytes: 10485760
  maxRedirects: 5
  maxConcurrency: 4
  minimumDelayMs: 250
  respectRobotsTxt: true

officialSourcesPath: official-sources.yml

logging:
  level: info
