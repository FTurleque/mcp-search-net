use_default_settings: true

general:
  instance_name: mcp-search-net

search:
  safe_search: 1
  autocomplete: ''
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: 0.0.0.0
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

# Engine configuration: only Bing responds reliably in this Docker Desktop/Windows
# environment; other general engines (google, brave, ddg, startpage, qwant, mojeek,
# yahoo) are rate-limited or blocked at the network level.
engines:
  - name: bing
    disabled: false
  - name: bing news
    disabled: false
  - name: google
    disabled: true
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: yahoo
    disabled: true
  - name: qwant
    disabled: true
  - name: mojeek
    disabled: true
